name: Release

# Layer2 — automatic build & publish.
# Triggered by pushing a version tag (e.g. `0.7.5`, without a `v` prefix). Split into two jobs:
#   verify  : re-runs typecheck + test + checks package.json version == tag  (gate)
#   release : needs: verify -> only starts if verify is green; builds, zips the
#             MV3 package, and creates a GitHub Release with the zip attached.
# The `needs:` dependency is an engine-level hard gate: if verify fails, release
# never starts, so a broken tag can never produce a published artifact.

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

permissions:
  contents: write

jobs:
  verify:
    name: Verify (gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Version consistency
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version OK: $PKG_VERSION"

  release:
    name: Build & Publish
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Package extension
        id: package
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          ZIP="webagentcli-${VERSION}.zip"
          rm -rf pkg && mkdir -p pkg
          cp manifest.json pkg/
          cp -r dist pkg/
          cp -r assets pkg/ 2>/dev/null || true
          cp LICENSE pkg/ 2>/dev/null || true
          cp README.md pkg/ 2>/dev/null || true
          cd pkg
          zip -r "../${ZIP}" .
          cd ..
          echo "ZIP=${ZIP}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Web Agent Client ${{ steps.version.outputs.VERSION }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ steps.package.outputs.ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
