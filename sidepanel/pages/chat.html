<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对话 - Web Agent</title>
  <link rel="stylesheet" href="../theme/variables.css">
  <link rel="stylesheet" href="../theme/utilities.css">
  <link rel="stylesheet" href="../theme/layout.css">
  <link rel="stylesheet" href="../theme/buttons.css">
  <link rel="stylesheet" href="../theme/forms.css">
  <link rel="stylesheet" href="../theme/cards.css">
  <link rel="stylesheet" href="../theme/badges.css">
  <link rel="stylesheet" href="../theme/dialogs.css">
  <link rel="stylesheet" href="../theme/tooltips.css">
  <link rel="stylesheet" href="../theme/markdown.css">
  <link rel="stylesheet" href="../theme/chat-components.css">
  <link rel="stylesheet" href="../theme/animations.css">
  <link rel="stylesheet" href="../theme/chat-demo.css">
</head>
<body>
  <div class="page chat-page">
    <!-- 消息列表 -->
    <div id="message-list" class="page-content">
      <div class="empty-state">
        <div class="empty-state-icon">💬</div>
        <div class="empty-state-title">开始对话</div>
        <div class="empty-state-desc">输入消息开始聊天</div>
      </div>
    </div>
    
    <!-- 状态栏 -->
    <div id="status-bar" class="status-bar"></div>
    
    <!-- 输入区 -->
    <div class="input-area">
      <textarea 
        id="message-input" 
        class="textarea" 
        placeholder="输入消息... (Shift+Enter 换行)" 
        rows="3"
      ></textarea>
      <div class="input-actions">
        <button id="send-btn" class="btn btn-primary">发送</button>
        <button id="stop-btn" class="btn btn-error" style="display:none;">停止</button>
      </div>
    </div>
  </div>
</body>
</html>
