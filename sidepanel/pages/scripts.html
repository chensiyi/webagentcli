<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>脚本 - Web Agent</title>
  <link rel="stylesheet" href="../theme/variables.css">
  <link rel="stylesheet" href="../theme/utilities.css">
  <link rel="stylesheet" href="../theme/layout.css">
  <link rel="stylesheet" href="../theme/buttons.css">
  <link rel="stylesheet" href="../theme/forms.css">
  <link rel="stylesheet" href="../theme/cards.css">
  <link rel="stylesheet" href="../theme/badges.css">
  <link rel="stylesheet" href="../theme/dialogs.css">
  <link rel="stylesheet" href="../theme/tooltips.css">
  <link rel="stylesheet" href="../theme/animations.css">
</head>
<body>
  <div class="page scripts-page">
    <!-- 页面头部 -->
    <div class="page-header">
      <h2 class="page-title">用户脚本</h2>
      <button id="toggle-form-btn" class="btn btn-primary btn-small">安装脚本</button>
    </div>
    
    <!-- 内容区域 -->
    <div class="page-content">
      <!-- 安装表单（默认隐藏） -->
      <div id="install-form" style="display:none; padding: 20px;">
        <textarea 
          id="script-code-input" 
          class="textarea textarea-monospace" 
          placeholder="粘贴 Tampermonkey 用户脚本..." 
          style="min-height: 300px; margin-bottom: 16px;"
        ></textarea>
        <button id="install-btn" class="btn btn-success" style="width: 100%;">安装</button>
      </div>
      
      <!-- 编辑表单（默认隐藏） -->
      <div id="edit-form" style="display:none; padding: 20px;">
        <h3 style="margin-bottom: 16px;">编辑脚本</h3>
        <textarea 
          id="edit-script-code" 
          class="textarea textarea-monospace" 
          style="min-height: 300px; margin-bottom: 16px;"
        ></textarea>
        <div style="display: flex; gap: 8px;">
          <button id="save-edit-btn" class="btn btn-success" style="flex: 1;">保存</button>
          <button id="cancel-edit-btn" class="btn btn-text" style="flex: 1;">取消</button>
        </div>
      </div>
      
      <!-- 脚本列表 -->
      <div id="scripts-list"></div>
      
      <!-- 空状态 -->
      <div id="scripts-empty" class="empty-state">
        <div class="empty-state-icon">📜</div>
        <div class="empty-state-title">暂无脚本</div>
        <div class="empty-state-desc">点击右上角"安装脚本"开始添加</div>
      </div>
    </div>
  </div>
</body>
</html>
