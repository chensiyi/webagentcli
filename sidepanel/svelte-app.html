<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Agent Client — Svelte 5</title>

  <!-- Svelte 5 设计系统样式（Vite 构建产物，固定文件名；包含完整 CSS tokens） -->
  <link rel="stylesheet" href="../dist/assets/svelte-app.css">

  <!--
    ========================================
    Svelte 5 UI 入口 — 独立于旧 UI 运行
    ========================================
    构建产物: dist/svelte-app.bundle.js
    切换方式: 修改 manifest.json 中 sidepanel 路径
       旧 UI: "sidepanel": { "default_path": "sidepanel/sidepanel.html" }
       新 UI: "sidepanel": { "default_path": "sidepanel/svelte-app.html" }
  -->
</head>
<body>
  <div id="root"></div>

  <!-- Error Handler（最先加载，捕获一切错误） -->
  <script src="js/utils/error-handler.js"></script>

  <!-- 第三方库：Markdown 渲染器（ChatPage 需要） -->
  <script src="js/utils/marked.min.js"></script>

  <!-- ============ Svelte 5 应用（Vite 打包的 ES module） ============ -->
  <script type="module" src="../dist/svelte-app.bundle.js"></script>
</body>
</html>
