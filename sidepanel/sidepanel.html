<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Agent Client</title>
  <link rel="stylesheet" href="theme/variables.css">
  <link rel="stylesheet" href="theme/utilities.css">
  <link rel="stylesheet" href="theme/layout.css">
  <link rel="stylesheet" href="theme/buttons.css">
  <link rel="stylesheet" href="theme/forms.css">
  <link rel="stylesheet" href="theme/cards.css">
  <link rel="stylesheet" href="theme/tooltips.css">
  <link rel="stylesheet" href="theme/animations.css">
  <style>
    /* iframe 样式 */
    #page-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- 主内容区域 -->
    <div class="main-content">
      <iframe id="page-frame" src="pages/chat.html"></iframe>
    </div>
    
    <!-- 侧边栏导航 -->
    <nav class="sidebar">
      <button class="sidebar-btn active" data-page="chat.html" data-tooltip="对话">
        <span class="sidebar-btn-icon">💬</span>
      </button>
      <button class="sidebar-btn" data-page="scripts.html" data-tooltip="脚本">
        <span class="sidebar-btn-icon">📜</span>
      </button>
      <button class="sidebar-btn" data-page="history.html" data-tooltip="历史">
        <span class="sidebar-btn-icon">📋</span>
      </button>
      <button class="sidebar-btn" data-page="storage.html" data-tooltip="存储">
        <span class="sidebar-btn-icon">💾</span>
      </button>
      <button class="sidebar-btn" data-page="settings.html" data-tooltip="设置">
        <span class="sidebar-btn-icon">⚙️</span>
      </button>
    </nav>
  </div>
  
  <script src="sidepanel.js"></script>
</body>
</html>
