<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=400, initial-scale=1.0">
<title>Web Agent Client — Svelte 5 UI 入口预览</title>
<style>
/* ===== CSS 变量（与 src/app.css 设计系统一致） ===== */
:root {
  --color-primary: #378add;
  --color-primary-rgb: 55, 138, 221;
  --color-primary-light: #e8f4ff;
  --color-primary-dark: #2563aa;

  --color-bg: #f5f7fa;
  --color-surface: #ffffff;
  --color-surface-elevated: #ffffff;
  --color-surface-hover: rgba(0, 0, 0, 0.03);

  --color-border: rgba(0, 0, 0, 0.08);
  --color-border-medium: rgba(0, 0, 0, 0.12);
  --color-border-strong: rgba(0, 0, 0, 0.18);

  --color-text: #1a1d21;
  --color-text-secondary: #5d636b;
  --color-text-hint: #9aa2ad;
  --color-text-on-primary: #ffffff;

  --color-success: #639922;
  --color-success-rgb: 99, 153, 34;
  --color-success-light: #f0f7e6;
  --color-warning: #ef9f27;
  --color-warning-rgb: 239, 159, 39;
  --color-warning-light: #fdf4e3;
  --color-error: #e24b4a;
  --color-error-rgb: 226, 75, 74;
  --color-error-light: #fdeded;
  --color-danger: #e24b4a;
  --color-danger-rgb: 226, 75, 74;
  --color-danger-light: #fdeded;
  --color-info: #378add;
  --color-info-rgb: 55, 138, 221;
  --color-info-light: #e8f4ff;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.04);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.08);
  --shadow-focus: 0 0 0 3px rgba(55, 138, 221, 0.2);

  --radius-sm: 6px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 16px;
  --radius-pill: 999px;

  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 20px;
  --space-6: 24px;
  --space-8: 32px;
  --space-10: 40px;
  --space-12: 48px;

  --font-sans: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --font-mono: 'SF Mono', SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace;

  --text-xs: 11px;
  --text-sm: 12px;
  --text-base: 13px;
  --text-md: 14px;
  --text-lg: 16px;
  --text-xl: 18px;
  --text-2xl: 20px;
  --text-3xl: 24px;

  --transition-fast: 120ms ease;
  --transition-normal: 200ms ease;
  --transition-slow: 300ms ease;
}

[data-theme="dark"] {
  --color-primary: #5aa8f5;
  --color-primary-rgb: 90, 168, 245;
  --color-primary-light: #1a3a5c;
  --color-primary-dark: #7dbbfa;

  --color-bg: #121418;
  --color-surface: #1c1f24;
  --color-surface-elevated: #24282e;
  --color-surface-hover: rgba(255, 255, 255, 0.04);

  --color-border: rgba(255, 255, 255, 0.08);
  --color-border-medium: rgba(255, 255, 255, 0.12);
  --color-border-strong: rgba(255, 255, 255, 0.18);

  --color-text: #f0f2f5;
  --color-text-secondary: #a8afb8;
  --color-text-hint: #6b7280;
  --color-text-on-primary: #0d1117;

  --color-success: #7fb844;
  --color-success-rgb: 127, 184, 68;
  --color-success-light: #1e3011;
  --color-warning: #f0b351;
  --color-warning-rgb: 240, 179, 81;
  --color-warning-light: #3d2a0d;
  --color-error: #f07070;
  --color-error-rgb: 240, 112, 112;
  --color-error-light: #3d1a1a;
  --color-danger: #f07070;
  --color-danger-rgb: 240, 112, 112;
  --color-danger-light: #3d1a1a;
  --color-info: #5aa8f5;
  --color-info-rgb: 90, 168, 245;
  --color-info-light: #1a3a5c;

  --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.3);
  --shadow-focus: 0 0 0 3px rgba(90, 168, 245, 0.25);
}

/* ===== Reset ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%; overflow: hidden;
  font-family: var(--font-sans);
  font-size: var(--text-base); line-height: 1.5;
  color: var(--color-text);
  background: #e8e8e8;
  -webkit-font-smoothing: antialiased;
  display: flex; justify-content: center; align-items: center;
}

/* ===== 模拟 Chrome 侧边栏 (400px 宽) ===== */
.app-frame {
  width: 400px; height: 600px;
  border: 1px solid var(--color-border);
  border-radius: 12px;
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  display: flex; flex-direction: column;
  background: var(--color-bg);
  position: relative;
}

/* ===== 顶部标题栏 ===== */
.app-topbar {
  height: 42px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px;
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  user-select: none;
  cursor: default;
}
.app-topbar-title {
  font-size: 11px; font-weight: 700; color: var(--color-text-secondary);
  letter-spacing: 0.5px; text-transform: uppercase;
}
.app-topbar-badge {
  font-size: 10px; font-weight: 600;
  background: var(--color-primary); color: #fff;
  padding: 2px 8px; border-radius: var(--radius-pill);
}

/* ===== Svelte App 容器 ===== */
.app-container {
  flex: 1; display: flex; flex-direction: column;
  background: var(--color-bg);
  overflow: hidden;
}
.main-content {
  display: flex; flex-direction: row; flex: 1;
  min-height: 0; overflow: hidden;
}
.content-area {
  flex: 1; min-width: 0; min-height: 0;
  overflow-y: auto; overflow-x: hidden;
}
.content-area::-webkit-scrollbar { width: 5px; }
.content-area::-webkit-scrollbar-track { background: transparent; }
.content-area::-webkit-scrollbar-thumb { background: var(--color-border-strong); border-radius: var(--radius-pill); }

/* ===== Sidebar（新版） ===== */
.sidebar {
  display: flex; flex-direction: column;
  gap: var(--space-1); padding: var(--space-2) var(--space-1);
  background: var(--color-surface);
  border-left: 1px solid var(--color-border);
  width: 48px; flex: 0 0 48px;
  align-self: stretch; min-height: 0;
  z-index: 10;
}
.sidebar-btn {
  display: flex; align-items: center; justify-content: center;
  width: 40px; height: 40px;
  border: none; border-radius: var(--radius-md);
  background: transparent;
  color: var(--color-text-secondary);
  cursor: pointer;
  transition: all var(--transition-fast);
}
.sidebar-btn:hover { background: var(--color-surface-hover); color: var(--color-text); }
.sidebar-btn.active { background: var(--color-primary); color: var(--color-text-on-primary); box-shadow: var(--shadow-sm); }
.sidebar-btn.active:hover { background: var(--color-primary-dark); }
.sidebar-btn-icon { font-size: 18px; line-height: 1; user-select: none; }

/* ===== Page 通用（新版 PagePlaceholder） ===== */
.page { display: flex; flex-direction: column; height: 100%; min-height: 100%; animation: pageEnter 180ms ease; }
.page-header {
  padding: var(--space-5) var(--space-5) var(--space-4);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-surface);
  flex-shrink: 0;
}
.page-title {
  font-size: var(--text-2xl); font-weight: 700; color: var(--color-text);
  margin: 0 0 var(--space-1) 0; display: flex; align-items: center; gap: var(--space-2);
  letter-spacing: -0.01em;
}
.title-icon { font-size: 22px; line-height: 1; }
.page-subtitle { font-size: var(--text-md); color: var(--color-text-secondary); margin: 0; line-height: 1.5; }
.page-body { flex: 1; padding: var(--space-5); overflow-y: auto; min-height: 0; }

.placeholder-card {
  background: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-xl);
  padding: var(--space-10) var(--space-6);
  text-align: center;
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-normal);
}
.placeholder-card:hover { border-color: var(--color-border-medium); box-shadow: var(--shadow-md); }
.placeholder-icon { font-size: 56px; margin-bottom: var(--space-5); line-height: 1; filter: grayscale(0.2); }
.placeholder-content strong { display: block; font-size: var(--text-lg); font-weight: 600; margin-bottom: var(--space-2); color: var(--color-text); }
.placeholder-content p { font-size: var(--text-md); color: var(--color-text-secondary); line-height: 1.7; margin: 0; }
.placeholder-progress {
  margin-top: var(--space-6); height: 6px;
  background: var(--color-bg); border-radius: var(--radius-pill); overflow: hidden;
}
.progress-bar {
  width: 35%; height: 100%;
  background: linear-gradient(90deg, var(--color-primary) 0%, var(--color-primary-dark) 100%);
  border-radius: var(--radius-pill);
  animation: progress 2s ease-in-out infinite;
}

/* ===== 主题切换小按钮 ===== */
.theme-switch {
  position: absolute; bottom: 8px; right: 56px;
  width: 28px; height: 28px;
  border: 1px solid var(--color-border); border-radius: var(--radius-sm);
  background: var(--color-surface); cursor: pointer; opacity: 0.5;
  transition: opacity 0.2s; z-index: 20;
  display: flex; align-items: center; justify-content: center;
}
.theme-switch:hover { opacity: 1; }

@keyframes progress {
  0% { width: 25%; opacity: 0.7; }
  50% { width: 75%; opacity: 1; }
  100% { width: 25%; opacity: 0.7; }
}

@keyframes pageEnter {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>

<div class="app-frame" id="app">
  <div class="app-topbar">
    <span class="app-topbar-title">Web Agent Client</span>
    <span class="app-topbar-badge">Svelte 5</span>
  </div>

  <div class="app-container">
    <div class="main-content">
      <div class="content-area" id="content-area"></div>
      <nav class="sidebar" aria-label="主导航" id="sidebar"></nav>
    </div>
  </div>

  <button class="theme-switch" id="theme-switch" title="切换主题">🌓</button>
</div>

<script>
(() => {

const PAGES = [
  { id: 'chat',      icon: '💬', label: '对话' },
  { id: 'history',   icon: '📋', label: '历史' },
  { id: 'storage',   icon: '💾', label: '存储' },
  { id: 'scripts',   icon: '📜', label: '脚本' },
  { id: 'settings',  icon: '⚙️', label: '设置' },
];

const PAGE_CONTENT = {
  chat:     { icon: '💬', title: '对话',     subtitle: '与 AI Agent 实时对话',                       name: 'ChatPage',     desc: '此页面将在后续阶段通过消息气泡、流式渲染、工具调用卡片等 Svelte 组件完整实现。' },
  history:  { icon: '📋', title: '历史',     subtitle: '管理对话历史记录',                           name: 'HistoryPage',  desc: '将实现搜索过滤、时间分组、对话卡片列表、分页等功能。' },
  storage:  { icon: '💾', title: '存储',     subtitle: '浏览和管理 Chrome Storage 数据',             name: 'StoragePage',  desc: '将实现统计卡片、Key 搜索过滤、存储项列表、编辑/删除操作等。' },
  scripts:  { icon: '📜', title: '脚本',     subtitle: '管理用户自定义脚本',                         name: 'ScriptsPage',  desc: '将实现脚本卡片、启用/禁用开关、编辑/删除操作、安装入口等。' },
  settings: { icon: '⚙️', title: '设置',     subtitle: '配置 Provider、API Key 及全局选项',         name: 'SettingsPage', desc: '将实现 Provider 选择、API Key 配置、模型搜索、Temperature 滑块、主题切换等。' }
};

let activePage = 'chat';

const sidebar = document.getElementById('sidebar');
function renderSidebar() {
  sidebar.innerHTML = PAGES.map(p => `
    <button class="sidebar-btn ${activePage === p.id ? 'active' : ''}"
            data-page="${p.id}" title="${p.label}"
            aria-current="${activePage === p.id ? 'page' : 'none'}">
      <span class="sidebar-btn-icon">${p.icon}</span>
    </button>
  `).join('');
}
renderSidebar();

const contentArea = document.getElementById('content-area');
function renderPage(pageId) {
  const p = PAGE_CONTENT[pageId];
  contentArea.innerHTML = `
    <div class="page">
      <header class="page-header">
        <h2 class="page-title"><span class="title-icon">${p.icon}</span> ${p.title}</h2>
        <p class="page-subtitle">${p.subtitle}</p>
      </header>
      <div class="page-body">
        <div class="placeholder-card">
          <div class="placeholder-icon">${p.icon}</div>
          <div class="placeholder-content">
            <strong>${p.name}</strong>
            <p>${p.desc}</p>
          </div>
          <div class="placeholder-progress"><div class="progress-bar"></div></div>
        </div>
      </div>
    </div>
  `;
}
renderPage('chat');

sidebar.addEventListener('click', (e) => {
  const btn = e.target.closest('.sidebar-btn');
  if (!btn) return;
  const pageId = btn.dataset.page;
  if (pageId === activePage) return;
  activePage = pageId; renderSidebar(); renderPage(pageId);
});

const themeSwitch = document.getElementById('theme-switch');
let isDark = false;
themeSwitch.addEventListener('click', () => {
  isDark = !isDark;
  document.documentElement.setAttribute('data-theme', isDark ? 'dark' : '');
  themeSwitch.textContent = isDark ? '☀️' : '🌓';
});

})();
</script>

</body>
</html>
